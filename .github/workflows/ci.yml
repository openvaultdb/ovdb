name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    # Pinned to an exact tag, not the retired moving @v1 — an unpinned CI
    # workflow silently takes whatever lands upstream, and @v1 previously
    # lagged 14 patch releases behind while still accepting newer inputs
    # (which is how a macOS signing gate came to no-op elsewhere in the
    # fleet). Verified at this exact tag (see .github/workflows/release.yml
    # for how) before use.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.17
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      # Version bump + release happen in release.yml (continuous delivery on
      # push to main). This workflow only builds/lints/tests — disable its
      # bump so it does not create a competing tag.
      #
      # Without this, CI would tag first; the Release workflow then computes
      # the same proposed version, finds it already tagged, and publishes
      # nothing — a green run with no release. This exact bug hit sneat-cli
      # and cost it several no-op releases.
      disable-version-bumping: true
      cgo_enabled: false
      code_coverage: true
      # min_test_coverage_percent intentionally omitted: measured coverage
      # on this brand-new split-out repo is ~3% (one small package with
      # token_test.go as its only test file). A floor at or near that
      # number would be nearly meaningless and brittle (see
      # datatug-cli/.github/workflows/golangci.yml's own note about
      # toolchain-driven coverage-counting swings) — better to add a real
      # floor once test coverage is deliberately built out.

  # Proves S3 (spec/features/configuration-parity#REQ:increment-zero-spikes):
  # the web console and TODO app build with pnpm and actually end up embedded
  # in the ovdb binary. A red run here means a release would ship the
  # "web console isn't built" fallback instead of the real console.
  web:
    name: Web build, test, embed and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No corepack: web/package.json's packageManager field pins the exact
      # pnpm version, and this action reads it, same pin the release hook in
      # .goreleaser.yaml uses.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm -C web install --frozen-lockfile

      - name: pnpm lint (text-only rendering, vue/no-v-html)
        run: pnpm -C web lint

      - name: pnpm build
        run: pnpm -C web build

      - name: pnpm test
        run: pnpm -C web test -- --maxWorkers=1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: true

      # single-target keeps this to one build (the runner's own OS/arch)
      # rather than GoReleaser's full release matrix — this job exists to
      # prove the embed, not to reproduce release-targets.
      - name: goreleaser build --snapshot (proves the embed)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean --single-target

      # spec/features/configuration-parity#REQ:ci-matrix: Playwright
      # (Chromium) journeys on Linux, against a real ovdb binary with the
      # console embedded, started in an isolated temporary OVDB home by
      # web/e2e/global-setup.ts.
      - name: Build ovdb for the browser tests
        run: go build -o "$RUNNER_TEMP/ovdb" .

      - name: Install Chromium for Playwright
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: Playwright (smoke and screens)
        run: pnpm -C web e2e --workers=1
        env:
          OVDB_E2E_BIN: ${{ runner.temp }}/ovdb

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results/
            web/e2e/screenshots/
          retention-days: 7

  # spec/features/configuration-parity#REQ:ci-matrix: lifecycle and path
  # tests on every OS the local server supports. They start real detached
  # servers, bind loopback ports and check owner-only files, so a green Linux
  # run proves nothing about Windows job objects, ACLs or macOS SO_REUSEADDR.
  go-os-matrix:
    name: Lifecycle and paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          cache: true
      # Project contexts (symlinks, Windows drive letters and case, Git
      # worktrees) and data paths join the matrix in increment 3.
      # The TODO demo service writes inGitDB records, which work on Windows
      # since ingitdb/dalgo2ingitdb v0.6.1 (increment 4).
      - name: go test (runtime, paths, context, demo, cli)
        run: go test -count=1 -timeout 10m ./internal/runtime/... ./internal/paths/... ./internal/setup/dbcontext/... ./internal/setup/demo/... ./internal/datapath/... ./internal/cli/...
      # Connecting existing storage reads Git repositories and SQLite files
      # through OS paths (a file: URI on Windows) and must leave them as they
      # are on every OS (increment 5).
      - name: go test (connect existing storage)
        run: go test -count=1 -timeout 10m -run 'TestConnect|TestWriteWithoutGitIdentity' ./internal/setup/ ./internal/localserver/

  # Fail fast on go.mod/go.sum drift.
  #
  # This is the signal that would have caught datatug-cli's v0.13.2 before it
  # shipped: two renovate pull requests for the same major bump interleaved and
  # left go.mod requiring a version nothing imported. Build-and-test caught the
  # stale imports only after both had merged; an untidy go.mod is visible on the
  # FIRST of the pair, on its own pull request.
  #
  # `-diff` only reports; it never rewrites go.mod, so unlike a mutating
  # `go mod tidy` it cannot mask the drift it is meant to find. This job belongs
  # to the workflow named by release.yml's `require_workflow_success`, so drift
  # also blocks the release, not just the merge.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= this repo's go.mod `go` directive.
          go-version: '1.26.1'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff
