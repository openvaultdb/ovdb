name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it — all in one run. Pushing an explicit `vX.Y.Z` tag also works
# and releases that exact version (the shared workflow skips the bump on a
# tag ref). A docs/chore-only merge cuts no tag and publishes nothing.
#
# ovdb is pre-1.0 (0 releases so far): allow_major_version_bump stays false,
# so a stray `feat!:` is CAPPED to a minor bump instead of jumping to v1.
# Cut v1.0.0 of openvaultdb/ovdb deliberately by pushing that tag.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build + release (GitHub release, Homebrew cask)
    # Pinned to an immutable tag rather than the retired floating `v1` of
    # strongo/cicd. This is load-bearing, not cosmetic: `@v1` DEFINES the
    # require_notarized_macos input below but historically did not (as of
    # the fleet's sneat-cli/ingitdb-cli setups) reliably contain the
    # macos_signing_preflight job that input is supposed to gate — on a
    # stale `@v1` the gate can silently no-op, and a stale/revoked Apple
    # credential would then ship an unsigned darwin binary via the Homebrew
    # cask with no failure anywhere. v1.14.15 verified (by reading
    # strongo/cicd's release.yml at that exact tag) to define
    # require_notarized_macos and contain the macos_signing_preflight job
    # gated on it. Bump this pin deliberately, and re-verify the preflight
    # job is still wired, rather than tracking `@v1`.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.15
    permissions:
      contents: write
    with:
      # Must be >= go.mod's `go 1.26.0` / `toolchain go1.27.0` directives.
      # The shared release job runs its `go mod tidy` before-hook under this
      # setup-go version with GOTOOLCHAIN=local, so a lower value fails with
      # "go.mod requires go >= 1.27.0" before the build ever starts.
      go_version: '1.27.0'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump. Cut
      # v1.0.0 only by pushing that tag explicitly.
      allow_major_version_bump: false
      # The whole point of this workflow: hard-fail the release if the
      # darwin binaries aren't actually signed with a Developer ID and
      # notarized, instead of silently shipping a Homebrew cask that
      # Gatekeeper blocks for every real user ("Apple could not verify ...
      # is free of malware").
      require_notarized_macos: true
    secrets:
      # Cross-repo PAT for the Homebrew tap (openvaultdb/homebrew-tap) — the
      # default GITHUB_TOKEN can't push to a different repo.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.OPENVAULTDB_GORELEASER_GITHUB_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block
      # in .goreleaser.yaml (gated on MACOS_SIGN_P12 being set) and, combined
      # with require_notarized_macos: true above, are enforced from this
      # repo's very first release.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
